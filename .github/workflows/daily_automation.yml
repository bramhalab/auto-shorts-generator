name: YouTube Shorts Automation (Pure GitHub Actions)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Product Name or Topic (Optional)'
        required: false
        default: ''
      affiliate_link:
        description: 'Custom Affiliate Link (Optional)'
        required: false
        default: ''
      custom_script:
        description: 'Custom Script Prompt/Text (Optional)'
        required: false
        default: ''
      lang:
        description: 'Language (hinglish/hindi/english)'
        required: false
        default: 'hinglish'

  # Automate karne ke liye neeche di gayi lines un-comment karein:
  # schedule:
  #   - cron: '0 8 * * *'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Fast & reliable FFmpeg installation
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Manual or Automated Short Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_AFFILIATE: ${{ github.event.inputs.affiliate_link }}
          INPUT_SCRIPT: ${{ github.event.inputs.custom_script }}
          INPUT_LANG: ${{ github.event.inputs.lang }}
        run: |
          python cli_runner.py

      - name: Commit and Push Video to Repo Output Folder
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate video output [skip ci]"
            git push
          fi

      - name: Upload Output Video as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: output/
          retention-days: 7
