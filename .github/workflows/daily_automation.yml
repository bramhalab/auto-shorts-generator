name: YouTube Shorts Automation (Pure GitHub Actions)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Product Name or Topic (Optional)'
        required: false
        default: ''
      affiliate_link:
        description: 'Custom Affiliate Link (Optional)'
        required: false
        default: ''
      lang:
        description: 'Language (hinglish/hindi/english)'
        required: false
        default: 'hinglish'

  # Automate karne ke liye neeche di gayi lines un-comment karein:
  # schedule:
  #   - cron: '0 8 * * *'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Manual or Automated Short Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_AFFILIATE: ${{ github.event.inputs.affiliate_link }}
          INPUT_LANG: ${{ github.event.inputs.lang }}
        run: |
          python cli_runner.py
