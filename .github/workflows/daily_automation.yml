name: Auto Shorts Generator

on:
  workflow_dispatch: # Actions tab se manually run karne ke liye
  push:
    branches:
      - main

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python Setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. System Dependencies (FFmpeg)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 4. Python Dependencies Install karna
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Output Directory Create karna
      - name: Create Output Directory
        run: |
          mkdir -p output

      # 6. Short Generator Script Run karna (Video Banane Ke Liye)
      # Apne script ka sahi naam Yahan update karein (e.g., main.py ya generator.py)
      - name: Run Video Generator
        run: |
          python main.py --output_dir output/

      # 7. Video ko Github Actions Artifacts me Upload karna (Direct Download Link)
      - name: Upload Generated Videos
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts-video
          path: output/
          retention-days: 7
