name: Generate Shorts Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Product Name or Topic (Optional)'
        required: false
        type: string
      custom_script:
        description: 'Custom Script Text (Optional - Overrides AI)'
        required: false
        type: string
      affiliate_link:
        description: 'Custom Affiliate Link (Optional)'
        required: false
        type: string
      language:
        description: 'Language (hinglish/hindi/english)'
        required: false
        default: 'hinglish'
        type: string

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests gTTS moviepy

      - name: Run Script Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_CUSTOM_SCRIPT: ${{ github.event.inputs.custom_script }}
          INPUT_AFFILIATE_LINK: ${{ github.event.inputs.affiliate_link }}
          INPUT_LANGUAGE: ${{ github.event.inputs.language }}
        run: |
          python script.py

      - name: Upload Generated Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-video
          path: output.mp4
